<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Open Road Prototype</title>
    <meta name="description" content="Mobile-first 3D open-world racing prototype as progressive web app." />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main id="app">
      <div id="render-root" aria-label="3D Spielbereich"></div>

      <section id="menu" class="overlay visible" aria-label="Startmenü">
        <div class="panel">
          <h1>Open Road Prototype</h1>
          <p>Technische 3D-Racing-Basis für Mobile und GitHub Pages.</p>
          <button id="start-btn" class="primary">Start</button>
        </div>
      </section>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div><strong>Geschwindigkeit</strong> <span id="speed">0</span> km/h</div>
        <div><strong>Modus</strong> <span id="mode">Fahrt</span></div>
      </section>

      <button id="pause-btn" class="floating hidden" type="button">Menü</button>

      <section id="touch-controls" class="controls hidden" aria-label="Touch-Steuerung">
        <div class="left-pad">
          <button id="touch-left" aria-label="Links lenken">◀</button>
          <button id="touch-right" aria-label="Rechts lenken">▶</button>
        </div>
        <div class="right-pad">
          <button id="touch-brake" aria-label="Bremsen">Bremse</button>
          <button id="touch-throttle" aria-label="Gas geben">Gas</button>
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
